<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" style="background: transparent;">
  <!-- Stylized Brand Typography -->
  <g fill="#8B1E1E" text-anchor="middle" font-family="'Libre Caslon Text', 'Playfair Display', 'Georgia', serif">
    <!-- JAIN -->
    <text x="250" y="140" font-size="96" font-weight="700" letter-spacing="1">Jain</text>
    <!-- Flourish crossbar over desi -->
    <path d="M 120 155 Q 250 150 380 155" stroke="#8B1E1E" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M 105 130 Q 130 148 165 152" stroke="#8B1E1E" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    
    <!-- DESI with Devanagari touch & floral motif inside D -->
    <text x="250" y="240" font-size="105" font-weight="700" letter-spacing="2">desi</text>
    <!-- Floral rosette in 'd' -->
    <circle cx="160" cy="210" r="4.5" fill="#C59B27"/>
    <g fill="#C59B27">
      <ellipse cx="160" cy="198" rx="3.5" ry="5.5"/>
      <ellipse cx="160" cy="222" rx="3.5" ry="5.5"/>
      <ellipse cx="148" cy="210" rx="5.5" ry="3.5"/>
      <ellipse cx="172" cy="210" rx="5.5" ry="3.5"/>
      <ellipse cx="152" cy="202" rx="4.5" ry="4" transform="rotate(-45 152 202)"/>
      <ellipse cx="168" cy="218" rx="4.5" ry="4" transform="rotate(-45 168 218)"/>
      <ellipse cx="168" cy="202" rx="4.5" ry="4" transform="rotate(45 168 202)"/>
      <ellipse cx="152" cy="218" rx="4.5" ry="4" transform="rotate(45 152 218)"/>
    </g>

    <!-- 'n' flanked by gold accent lines -->
    <g>
      <line x1="140" y1="262" x2="215" y2="262" stroke="#C59B27" stroke-width="3.5" stroke-linecap="round"/>
      <text x="250" y="274" font-size="44" font-weight="600" fill="#2E7D32" font-family="'Libre Caslon Text', 'Georgia', serif">n</text>
      <line x1="285" y1="262" x2="360" y2="262" stroke="#C59B27" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- PURE -->
    <text x="250" y="365" font-size="100" font-weight="700" letter-spacing="2">pure</text>
  </g>

  <!-- Ornate bottom ornament -->
  <g fill="#C59B27" stroke="#C59B27">
    <circle cx="138" cy="395" r="3.5"/>
    <line x1="148" y1="395" x2="218" y2="395" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Central lotus / floral emblem -->
    <g transform="translate(250, 395)" fill="#C59B27">
      <ellipse cx="0" cy="-14" rx="4.5" ry="8"/>
      <ellipse cx="-11" cy="-4" rx="4" ry="7" transform="rotate(-45 -11 -4)"/>
      <ellipse cx="11" cy="-4" rx="4" ry="7" transform="rotate(45 11 -4)"/>
      <ellipse cx="-8" cy="10" rx="3.5" ry="6" transform="rotate(-70 -8 10)"/>
      <ellipse cx="8" cy="10" rx="3.5" ry="6" transform="rotate(70 8 10)"/>
      <circle cx="0" cy="0" r="3.5"/>
    </g>

    <line x1="282" y1="395" x2="352" y2="395" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="362" cy="395" r="3.5"/>
  </g>

  <!-- Tagline -->
  <text x="250" y="445" font-family="'Cinzel', 'Montserrat', sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#1C1C1C" text-anchor="middle">
    WE MAKE YOUR KITCHEN CHEMICAL FREE
  </text>
</svg>